<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>quant-web 真实页面视口 QA</title>
<style>
  body{margin:16px;background:#e4e7eb;font:14px Arial,sans-serif;color:#25364b}
  form{display:flex;gap:12px;align-items:center;margin-bottom:16px}
  input{width:480px;padding:7px}select,button{padding:7px}
  iframe{display:block;background:#fff;border:0;box-shadow:0 0 0 1px #bdc5ce;width:390px;height:844px}
</style>
<form id="controls">
  <label>视口 <select id="size"><option value="390,844">390 × 844</option><option value="1024,768">1024 × 768</option></select></label>
  <label>本地路由 <input id="route" value="#/portfolio/strategies"></label>
  <button>打开页面</button><output id="dimensions">390 × 844 CSS px · 比例 1:1</output>
</form>
<iframe title="真实工作台测试视口" src="/#/portfolio/strategies"></iframe>
<script>
  const frame=document.querySelector('iframe');
  document.querySelector('#size').onchange=event=>{
    const [width,height]=event.target.value.split(',').map(Number);
    frame.style.width=width+'px';frame.style.height=height+'px';
    document.querySelector('#dimensions').textContent=`${width} × ${height} CSS px · 比例 1:1`;
  };
  document.querySelector('form').onsubmit=event=>{
    event.preventDefault();
    const route=document.querySelector('#route').value;
    if(!/^#\/(?:portfolio|tasks|paper|market|execution)(?:\/[a-zA-Z0-9_-]+)*$/.test(route))return;
    frame.src='/'+route;
  };
</script>
</html>
